[workspace]
members = ["programs/*", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
repository = "https://github.com/Definika/zap-protocol"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
