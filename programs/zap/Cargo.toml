[package]
name = "zap"
version = "0.1.0"
description = "ZAP Protocol: oracle-priced perpetual futures on Solana"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "zap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
zap-math = { path = "../../crates/zap-math" }
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
